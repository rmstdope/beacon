name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_REPOSITORY: ghcr.io/rmstdope/beacon

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REVISION: ${{ github.sha }}
      IMAGE: ghcr.io/rmstdope/beacon:${{ github.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Build the production image
        run: docker build --build-arg "REVISION=$REVISION" -t "$IMAGE" .
      - name: Smoke test the exact image
        run: deploy/smoke-test.sh "$IMAGE" "$REVISION"
      - name: Export the tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: mkdir -p publication && docker save "$IMAGE" -o publication/image.tar
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: tested-image
          path: publication/image.tar
          retention-days: 2
          compression-level: 0
          overwrite: true

  publish:
    needs: [checks, image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      REVISION: ${{ github.sha }}
      IMAGE: ghcr.io/rmstdope/beacon:${{ github.sha }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tested-image
          path: publication
      - name: Publish the tested image, without rebuilding
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker load -i publication/image.tar
          if docker manifest inspect "$IMAGE" > publication/remote.json 2>/dev/null; then
            local_id="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
            [ "$(jq -r .config.digest publication/remote.json)" = "$local_id" ] || {
              echo "::error::Revision tag already identifies a different image; refusing mutation"
              exit 1
            }
          fi
          docker push "$IMAGE"
          web="$(docker image inspect "$IMAGE" --format '{{json .RepoDigests}}' |
            jq -er --arg prefix "$IMAGE_REPOSITORY@" '.[] | select(startswith($prefix))')"
          jq -n --arg revision "$REVISION" --arg web "$web" \
            '{revision: $revision, images: {web: $web}}' > publication/deployment.json
          cat publication/deployment.json
      - name: Publish the deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: deployment-manifest
          path: publication/deployment.json
          retention-days: 90
          if-no-files-found: error
